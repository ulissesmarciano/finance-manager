<div class="flex flex-col gap-2 w-full">
  @if (label) {
    <label for="date-picker" class="text-12 font-semibold text-muted-foreground">{{ label }}</label>
  }
  <input
    type="date"
    id="date-picker"
    class="text-14 py-2 px-3 border border-default rounded-lg items-center justify-between w-full transition-all duration-200 focus:outline-none focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 cursor-pointer"
  />
</div>
