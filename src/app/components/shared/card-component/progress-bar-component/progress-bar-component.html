@if (barType === 'versus-bar') {
  <div class="flex h-2 overflow-hidden rounded-full bg-secondary">
    <span class="bg-primary" [style.width.%]="percentage"></span>
    <span class="bg-accent" [style.width.%]="100 - percentage"></span>
  </div>
  <div class="flex justify-between text-12 text-muted-foreground">
    <p>Fixas R$ 2.938,90</p>
    <p>Variáveis R$ 704,80</p>
  </div>
} @else if (barType === 'single-bar') {
  <div class="mt-3 flex h-2 overflow-hidden rounded-full bg-secondary">
    <span [class]="variantSingleBarClasses()" [style.width.%]="percentage"></span>
  </div>
  <div class="flex mt-2 justify-between text-12 text-muted-foreground">
    <p>R$ 2.938,90 de R$3.000,00</p>
    <p>R$ 202,00 restantes</p>
  </div>
}
