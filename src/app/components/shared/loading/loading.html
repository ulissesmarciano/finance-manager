<div

>
  <div class="flex flex-col items-center justify-center gap-4 text-center">
    <div class="relative h-16 w-16" aria-hidden="true">
      <span
        class="absolute left-1/2 top-1/2 block h-16 w-16 -translate-x-1/2 -translate-y-1/2 animate-spin rounded-full border-[3px] border-transparent border-r-primary border-t-primary motion-reduce:[animation-duration:2.8s]"
      ></span>
      <span
        class="absolute left-1/2 top-1/2 block h-11 w-11 -translate-x-1/2 -translate-y-1/2 animate-spin rounded-full border-[3px] border-transparent border-r-accent border-t-accent [animation-duration:1.15s] motion-reduce:[animation-duration:2.8s]"
      ></span>
      <span
        class="absolute left-1/2 top-1/2 block h-6 w-6 -translate-x-1/2 -translate-y-1/2 animate-spin rounded-full border-[3px] border-transparent border-r-success border-t-success [animation-duration:0.8s] motion-reduce:[animation-duration:2.8s]"
      ></span>
    </div>
  </div>
