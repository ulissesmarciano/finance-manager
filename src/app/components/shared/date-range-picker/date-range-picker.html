<div class="w-full">
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    class="w-full border border-border rounded-lg focus-within:border-primary date-range-field"
  >
    <mat-date-range-input [rangePicker]="picker" separator="–">
      <input
        matStartDate
        placeholder="Data inicial"
        aria-label="Data inicial"
        (dateChange)="startDate = $event.value"
      />
      <input
        matEndDate
        placeholder="Data final"
        aria-label="Data final"
        (dateChange)="endDate = $event.value"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker
      panelClass="date-range-picker-panel [&_.mat-calendar-body-cell-content]:text-sm [&_.mat-calendar-table-header_th]:text-xs [&_.mat-calendar-period-button]:text-sm"
      #picker
    ></mat-date-range-picker>
  </mat-form-field>
</div>
