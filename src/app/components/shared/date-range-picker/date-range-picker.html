<div class="w-full">
  <mat-form-field
    appearance="outline"
    subscriptSizing="dynamic"
    class="w-full border border-border rounded-lg focus-within:border-primary date-range-field"
  >
    <mat-date-range-input [rangePicker]="picker" separator="–">
      <input
      class="text-14! text-muted-foreground!"
        matStartDate
        placeholder="Data inicial"
        aria-label="Data inicial"
        (dateChange)="startDate = $event.value"
      />
      <input
      class="text-14! text-muted-foreground!"
        matEndDate
        placeholder="Data final"
        aria-label="Data final"
        (dateChange)="endDate = $event.value"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker
      panelClass="date-range-picker-panel font-semibold [&_.mat-calendar-body-cell-content]:text-12 text-muted-foreground [&_.mat-calendar-table-header]:text-12 text-muted-foreground [&_.mat-calendar-period-button]:text-12 text-muted-foreground "
      #picker
    ></mat-date-range-picker>
  </mat-form-field>
</div>
