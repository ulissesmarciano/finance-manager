<section class="py-6 px-5 flex flex-col gap-5">
  <div class="inline-flex rounded-lg bg-secondary p-1 gap-1 items center">
    @for (option of typeOptions; track option.value) {
      <app-button
        [variant]="selectedType === option.value ? 'secondary' : 'third'"
        [size]="'md'"
        class=""
        (click)="selectType(option.value)"
        [label]="option.label"
        [icon]="option.icon"
      ></app-button>
    }
  </div>
  <div>
    @if (selectedType === 'credit-card') {
      <div class="grid gap-5 lg:grid-cols-3">
        <app-credit-card-component [card]="creditCard1"></app-credit-card-component>
        <app-credit-card-component [card]="creditCard2"></app-credit-card-component>
        <app-credit-card-component [card]="creditCard3"></app-credit-card-component>
      </div>
    } @else {
      <div class="flex flex-col border border-border rounded-lg">
        <app-bank-account-list></app-bank-account-list>
      </div>
    }
  </div>
  <div>
    <app-card-component
      class="xl:col-span-2"
      type="donut-chart"
      chartTitle="Distribuição do saldo"
      chartSubtitle="Entre todas as contas"
      donutChartType="custom"
      [donutChartOptions]="categoryChartOptions"
      [donutChartItems]="[
        { name: 'Conta Corrente Principal', value: 'R$ 4.200,00' },
        { name: 'Reserva de Emergência', value: 'R$ 2.100,00' },
        { name: 'Caixinha de Viagem', value: 'R$ 1.500,00' },
        { name: 'Caixa de Investimentos', value: 'R$ 3.000,00' },
      ]"
      [donutChartData]="{
        labels: [
          'Conta Corrente Principal',
          'Reserva de Emergência',
          'Caixinha de Viagem',
          'Caixa de Investimentos',
        ],
        datasets: [
          {
            data: [42, 30, 18, 10],
            backgroundColor: ['#03A9F4', '#F59E0B', '#24B47E', '#9B5DE5'],
            borderColor: '#FFFFFF',
            borderWidth: 1,
            spacing: 4,
          },
        ],
      }"
    ></app-card-component>
  </div>
</section>
