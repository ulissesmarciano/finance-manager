<div
  class="flex flex-wrap items-end gap-5 p-5 border border-border bg-primary-foreground rounded-xl"
>
  <div class="flex items-center gap-2">
    <mat-icon fontSet="material-icons-outlined" class="text-primary! size-4! text-16!">
      filter_alt
    </mat-icon>
    <p class="text-14 font-semibold">Filtros</p>
  </div>
  <app-date-range-picker></app-date-range-picker>

  <div class="flex flex-col gap-1">
    <p class="text-12 text-muted-foreground font-semibold">Tipo</p>
    <div class="inline-flex rounded-lg bg-secondary p-1 gap-1 items center">
      @for (option of typeOptions; track option.value) {
        <app-button
          [variant]="selectedType === option.value ? 'secondary' : 'third'"
          [size]="'sm'"
          (click)="selectedType = option.value"
          [label]="option.label"
        ></app-button>
      }
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <p class="text-12 text-muted-foreground font-semibold">Natureza</p>
    <div class="inline-flex rounded-lg bg-secondary p-1 gap-1 items center">
      @for (option of natureOptions; track option.value) {
        <app-button
          [variant]="selectedNature === option.value ? 'secondary' : 'third'"
          [size]="'sm'"
          (click)="selectedNature = option.value"
          [label]="option.label"
        ></app-button>
      }
    </div>
  </div>
  <div class="flex flex-wrap flex-col gap-1">
    <p class="text-12 text-muted-foreground font-semibold">Forma de Pagamento</p>
    <div class="inline-flex flex-wrap rounded-lg bg-secondary p-1 gap-1 items center">
      @for (option of paymentMethodOptions; track option.value) {
        <app-button
          [variant]="selectedPaymentMethod === option.value ? 'secondary' : 'third'"
          [size]="'sm'"
          (click)="selectedPaymentMethod = option.value"
          [label]="option.label"
        ></app-button>
      }
    </div>
  </div>
</div>
