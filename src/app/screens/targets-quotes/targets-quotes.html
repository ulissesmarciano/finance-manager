<div class="grid gap-5 px-5 py-6 lg:px-8 lg:py-8">
  <section class="grid gap-5 sm:grid-cols-3">
    <app-card-component
      type="metrics"
      metricLabel="Total orçado"
      value="R$ 8.500,00"
    ></app-card-component>
    <app-card-component
      type="metrics"
      metricLabel="Gasto até agora"
      value="R$ 6.694,00"
    ></app-card-component>
    <app-card-component
      type="metrics"
      leftIcon="warning"
      metricLabel="Categorias perto do limite"
      value="3"
    ></app-card-component>
  </section>
  <section class="p-6 bg-primary-foreground rounded-lg shadow-md border border-border">
    <app-titles-component
      title="Orçamento mensal por categoria"
      size="md"
      subtitle="As barras ficam âmbar aos 80% de uso e vermelhas quando o limite é ultrapassado"
    ></app-titles-component>
    <div class="grid gap-5 lg:grid-cols-2 mt-6">
      <app-card-component
        type="budget"
        title="Moradia"
        barType="single-bar"
        singleBarType="descending"
        [valueRange]="{ current: 6694, total: 8500 }"
      >
      </app-card-component>
      <app-card-component
        type="budget"
        title="Transporte"
        barType="single-bar"
        singleBarType="descending"
        [valueRange]="{ current: 1250, total: 1500 }"
      >
      </app-card-component>
      <app-card-component
        type="budget"
        title="Saúde"
        barType="single-bar"
        singleBarType="descending"
        [valueRange]="{ current: 900, total: 1000 }"
      >
      </app-card-component>
      <app-card-component
        type="budget"
        title="Compras"
        barType="single-bar"
        singleBarType="descending"
        [valueRange]="{ current: 300, total: 500 }"
      >
      </app-card-component>
    </div>
  </section>
  <section class="p-6 bg-primary-foreground rounded-lg shadow-md border border-border">
    <app-titles-component
      title="Metas de economia"
      subtitle="Objetivos de longo prazo que você financia mensalmente"
      size="md"
    ></app-titles-component>
    <div class="grid gap-5 md:grid-cols-3 mt-6">
      <app-card-component
        type="metrics"
        topIcon="target"
        metricTitle="Reserva de emergência"
        metricLabel="Data alvo Dez 2006"
        value="R$ 3.000,00"
        foot="de R$ 5.000,00"
        barType="single-bar"
        singleBarType="growing"
        valueRangeDisplay="completion"
        [valueRange]="{ current: 3000, total: 5000 }"
      >
      </app-card-component>
      <app-card-component
        type="metrics"
        topIcon="target"
        metricTitle="Viagem ao Japão"
        metricLabel="Data alvo Jun 2007"
        value="R$ 10.000,00"
        foot="de R$ 20.000,00"
        barType="single-bar"
        singleBarType="growing"
        valueRangeDisplay="completion"
        [valueRange]="{ current: 10000, total: 20000 }"
      >
      </app-card-component>
      <app-card-component
        type="metrics"
        topIcon="target"
        metricTitle="Carro novo"
        metricLabel="Data alvo Dez 2008"
        value="R$ 50.000,00"
        foot="de R$ 100.000,00"
        barType="single-bar"
        singleBarType="growing"
        valueRangeDisplay="completion"
        [valueRange]="{ current: 90000, total: 100000 }"
      >
      </app-card-component>
    </div>
  </section>
</div>
